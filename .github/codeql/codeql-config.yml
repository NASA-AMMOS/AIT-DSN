name: "CodeQL Security Scan Configuration"

# Keep the default query suite and add the extended security queries.
disable-default-queries: false

queries:
  - uses: security-extended

# Scope note: AIT-DSN is a pure-Python package -- the SLE service interfaces
# (RAF/RCF/CLTU) in ait/dsn/sle, the CFDP implementation in ait/dsn/cfdp, the
# BCH codec, the frame processors in ait/dsn/proc, the encryption wrappers in
# ait/dsn/encrypt, the AIT server plugins in ait/dsn/plugins, and the CLI entry
# points and example clients in ait/dsn/bin. That is the code worth analyzing:
# it parses PDUs off the wire, speaks ASN.1 to ground stations and handles
# keys. Everything below is either not ours, not code, or not shipped.
paths-ignore:
  # Build output and caches -- not our source.
  - '**/__pycache__/**'
  - '**/*.pyc'
  - '**/.tox/**'
  - '**/.venv/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/*.egg-info/**'

  # Documentation. doc/ is Sphinx: ~76 .rst pages plus a conf.py that only
  # configures the doc build and is not shipped in the package.
  - 'doc/**'

  # Mission dictionary and settings data, not code.
  - 'config/**'

  # Tests. AIT-DSN keeps its suites inside the package, in per-subpackage
  # test/ directories (ait/dsn/{sle,cfdp,bch,proc,encrypt}/test), so the
  # exclusion is by directory rather than by filename.
  #
  # Note this deliberately does NOT exclude ait/dsn/bin/examples/*_test.py --
  # despite the name those are shipped example clients that open real SLE
  # sessions, not unit tests, and they are worth scanning.
  - '**/test/**'

query-filters:
  # Style and maintainability suggestions add volume without adding security
  # signal; SonarQube already covers that ground.
  - exclude:
      problem.severity: recommendation
