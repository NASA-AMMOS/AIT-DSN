# SonarQube Cloud configuration for AIT-DSN
#
# Set up per the AMMOS scanning guide:
#   https://wiki.jpl.nasa.gov/display/AmmosArch/Code+Vulnerability+Scanning+Set+Up+for+AMMOS+Open+Source+Software
#
# NOTE: confirm projectKey against the value shown under Information on the
# project's SonarQube Cloud Overview page before the first run --
# https://sonarcloud.io/organizations/nasa-ammos/projects
sonar.projectKey=NASA-AMMOS_AIT-DSN
sonar.organization=nasa-ammos

# Project metadata. projectVersion is overridden from pyproject.toml by the
# Security-Scan workflow, so the value here is only a fallback for a scan run
# outside that workflow.
sonar.projectName=AIT-DSN
sonar.projectVersion=2.2.2
sonar.projectDescription=AMMOS Instrument Toolkit (AIT) DSN - APIs for connecting to ground stations via CCSDS SLE and CFDP interfaces.

# Project links - shown in the SonarQube Cloud UI
sonar.links.homepage=https://ait-dsn.readthedocs.io/en/latest
sonar.links.scm=https://github.com/NASA-AMMOS/AIT-DSN
sonar.links.issue=https://github.com/NASA-AMMOS/AIT-DSN/issues
sonar.links.ci=https://github.com/NASA-AMMOS/AIT-DSN/actions

# ==========================================
# Analysis scope
# ==========================================
# Our own code only:
#   ait/        the Python package -- the SLE service interfaces (RAF/RCF/CLTU)
#               in ait/dsn/sle, the CFDP implementation in ait/dsn/cfdp, the BCH
#               codec, the frame processors in ait/dsn/proc, the encryption
#               wrappers in ait/dsn/encrypt, the AIT server plugins in
#               ait/dsn/plugins, and the CLI entry points and example clients
#               in ait/dsn/bin. This is the whole attack surface worth
#               scanning: PDU parsing off the wire, ASN.1 to ground stations,
#               and key handling.
#   .github/    workflow definitions, so the CodeQL `actions` findings have
#               source files to attach to, and the SARIF import can map them.
#
# Deliberately not listed:
#   config/     -- mission dictionaries and settings (cmd/tlm/evr/limits/table
#                  YAML plus the mib directory), data rather than code.
#   doc/        -- ~76 Sphinx .rst pages and a conf.py that is not shipped.
#
# Keep this in step with .github/codeql/codeql-config.yml: SonarQube can only
# attach an imported CodeQL finding to a file that is inside its own analysis
# scope, so anything CodeQL scans must be a source here too.
sonar.sources=ait,.github

# Exclusions. These are the only lever that keeps a path out of analysis --
# sonar.test.exclusions is deliberately not used, because it filters the file
# set named by sonar.tests, and sonar.tests is unset here (no coverage report
# is published today, so indexing the suites would only add LOC).
#
# AIT-DSN keeps its tests inside the package, in per-subpackage test/
# directories, and names them inconsistently (bch_test.py, pdu_test.py,
# test_tctf.py, test_encrypt.py). Excluding by directory catches all of them
# and, unlike a **/*_test.py filename pattern, leaves the shipped example
# clients in ait/dsn/bin/examples (cltu_api_test.py, raf_api_test.py and
# friends -- example SLE sessions, not unit tests) inside the scan.
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/.tox/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/*.egg-info/**,\
  ait/dsn/*/test/**

# Coverage exclusions - no coverage report is published today, but these
# should never count against it when one is.
sonar.coverage.exclusions=\
  ait/dsn/*/test/**,\
  ait/dsn/bin/**,\
  .github/**

# Duplication exclusions. The example clients under ait/dsn/bin/examples share
# a common connect/bind/start skeleton by design, as do the CFDP PDU classes;
# flagging that as duplication is noise.
sonar.cpd.exclusions=\
  ait/dsn/bin/examples/**

# Language settings. AIT-DSN supports Python >= 3.10 < 3.12 (pyproject.toml).
sonar.python.version=3.10,3.11
sonar.sourceEncoding=UTF-8

sonar.tags=nasa,ammos,ait,ground-data-system,sle,cfdp,ccsds,python

# New Code: anything added in the last 30 days counts as new.
sonar.leak.period=30

# sonar.sarifReportPaths is supplied by the Security-Scan workflow, which
# passes the repaired CodeQL reports on the scanner command line.
